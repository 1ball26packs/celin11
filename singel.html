<body>
<section class="menu-screen" id="menuScreen"><div class="menu-copy"><div class="menu-kicker">ARCADE / VS CPU</div><h1 class="menu-title">SINGLE!</h1><div class="menu-actions"><button class="comic-button primary" id="menuMatch">MATCH</button><button class="comic-button" id="menuSettings">SETTING</button></div><button class="comic-button character-choice" id="characterToggle">PILIH: SANG KAES</button></div></section>

<script>
(()=>{
const cvs=document.querySelector('#arena'),ctx=cvs.getContext('2d'),overlay=document.querySelector('#overlay'),menuScreen=document.querySelector('#menuScreen'),settingsScreen=document.querySelector('#settingsScreen'),pauseScreen=document.querySelector('#pauseScreen');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
const CELL=180,HEIGHT=200,portraitMode=window.matchMedia('(orientation: portrait) and (max-width: 700px)').matches;let W=portraitMode?540:960,H=portraitMode?Math.max(900,540*window.innerHeight/window.innerWidth):540,FLOOR=portraitMode?H*.79:482;
function sizeCanvas(){const box=cvs.getBoundingClientRect();if(portraitMode&&box.width>0&&box.height>0){H=Math.max(900,W*box.height/box.width);FLOOR=H*.79}const dpr=Math.min(window.devicePixelRatio||1,2),bw=Math.max(1,Math.round(box.width*dpr)),bh=Math.max(1,Math.round(box.height*dpr));if(cvs.width!==bw||cvs.height!==bh){cvs.width=bw;cvs.height=bh}const scale=Math.min(bw/W,bh/H),ox=(bw-W*scale)/2,oy=(bh-H*scale)/2;ctx.setTransform(scale,0,0,scale,ox,oy);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high'}addEventListener('resize',sizeCanvas);document.addEventListener('fullscreenchange',sizeCanvas);
const kopdesBg=new Image();kopdesBg.src='robot-sprites/bg-kopdes.jpg';function loadSprite(name){const im=new Image();im.src='robot-sprites/robot-'+name+'.png';return im}function loadSet(prefix,names){const set={};for(const name of names)set[name]=loadSprite(prefix+name);return set}const characters={kaes:{name:'SANG KAES',art:loadSet('', ['idle1','idle2','walk1','walk2','jump','block','victory2','jatuh','kick1','punch1','punch2','super','skill1','terhuyung'])},lil:{name:'LIL BAH',art:loadSet('lil-', ['idle1','idle2','block','jatuh','jump','kick','punch','super1','super2','terhuyung','win','win2'])}};let selectedCharacter='kaes';
let player,shade,active=false,paused=false,last=0,t=0,shake=0,flash=0,flashColor='#ffffff',particles=[],impactEffects=[],beamFX=null,explosionFX=null,round=1,wins=0,losses=0,resultTimer=0,gameEnded=false,slowMo=1,slowMoTimer=0,countdown=null,koSequence=null,winnerBanner=null,arenaStyle=(()=>{try{return Math.max(0,Math.min(2,Number(localStorage.getItem('robotRumbleArenaV2')||0)))}catch{return 0}})();

const held={};let soundEnabled=true,hitWordIndex=0;const hitWords=['CLANK!','BONK!'];
const soundClips={punch:'robot-sounds/punch.mp3',kick:'robot-sounds/kick.mp3',attack:'robot-sounds/attack.mp3',super:'robot-sounds/super.mp3'};
const bgm=new Audio('robot-sounds/bg.mp3');bgm.loop=true;bgm.volume=.32;
function fighter(side){return {side,charId:side==='p'?selectedCharacter:(selectedCharacter==='kaes'?'lil':'kaes'),x:side==='p'?(portraitMode?145:280):(portraitMode?395:680),y:FLOOR,hp:160,maxHp:160,meter:0,face:side==='p'?1:-1,pose:'idle',poseTime:0,poseLen:0,walkTime:0,vy:0,jumpY:0,blocking:false,stun:0,knockback:0,attack:null,hitDone:false,ai:.7+Math.random()*.6,dead:false,vanished:false,flash:0}}

loadRound();

function playClip(name){if(!soundEnabled)return;const src=soundClips[name];if(!src)return;const clip=new Audio(src);clip.volume=.9;clip.play().catch(()=>{})}

addEventListener('keydown',ev=>{held[ev.code]=true;if(['ShiftLeft','ShiftRight','KeyS'].includes(ev.code)&&!player.attack&&player.jumpY<=0)player.blocking=true;if(['Space','ArrowLeft','ArrowRight','ArrowUp'].includes(ev.code))ev.preventDefault();if(ev.repeat)return;if(ev.code==='KeyJ')strike(player,'punch');if(ev.code==='KeyK')strike(player,'kick');if(ev.code==='KeyL')strike(player,'staff');if(ev.code==='KeyI')strike(player,'cave-special');if(ev.code==='Space'||ev.code==='ArrowUp')jump(player);if(ev.code==='KeyR')start();if(ev.code==='KeyM')toggleSound();if(ev.code==='KeyP'||ev.code==='Escape')togglePause()});addEventListener('keyup',ev=>{held[ev.code]=false;if(['ShiftLeft','ShiftRight','KeyS'].includes(ev.code))player.blocking=false});
})();
</script></body></html>
